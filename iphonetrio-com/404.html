<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Page not found — iPhone Trio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
<meta name="theme-color" content="#eaeaea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  :root { color-scheme: light; --bg: #f5f5f7; --ink: #1d1d1f; --sub: #6e6e73; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --bg: #000; --ink: #f5f5f7; --sub: #86868b; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #000; --ink: #f5f5f7; --sub: #86868b; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink); text-align: center; padding: 2rem;
    font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 600; letter-spacing: -.025em; margin: 0 0 .5rem; }
  p { color: var(--sub); margin: 0 0 1.75rem; }
  a { color: var(--ink); text-decoration: underline; text-underline-offset: .15em; }
  a:hover { opacity: .7; }
</style>
</head>
<body>
  <main>
    <h1>This fold doesn't exist.</h1>
    <p>Neither does the phone, but that page is at least still there.</p>
    <a href="/">Back to iPhone Trio</a>
  </main>
</body>
</html>
